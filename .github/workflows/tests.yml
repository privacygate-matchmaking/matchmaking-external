name: External service tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: privacygate-matchmaking/privacygate
          ref: e4a841987d70b0506f69c38a0eec895b9fed4ec0
          path: .deps/privacygate
      - run: python -m pip install '.[test]' './.deps/privacygate[web]'
      - run: python -m pytest
