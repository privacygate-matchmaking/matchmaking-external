# Overlay only. First file must be ../privacygate/compose.yaml.
# No changes are made to matchmaking-internal or privacygate repositories.
services:
  external-api:
    build:
      context: ../matchmaking-external
      dockerfile: external-api/Dockerfile
      additional_contexts:
        privacygate: .
    environment:
      SESSION_DB_PATH: /data/external-session/sessions.sqlite3
      SESSION_KEY_FILE: /run/secrets/external_session_key
      GATE_MODE: ${GATE_MODE:-enforce}
    volumes:
      - external-session-data:/data/external-session
    secrets:
      - external_session_key
  transfer-api:
    build:
      context: ../matchmaking-external
      dockerfile: transfer-api/Dockerfile
      additional_contexts:
        privacygate: .
    environment:
      MATCHING_DIRECTORY_MODE: ${MATCHING_DIRECTORY_MODE:-internal}
      ENABLE_TEST_PAYMENTS: ${ENABLE_TEST_PAYMENTS:-false}
    depends_on:
      matching-migrate:
        condition: service_completed_successfully
  matching-migrate:
    profiles: [external]
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${TRANSFER_DB_OWNER_PASSWORD:?}
    command: ["psql", "-h", "transfer-db", "-U", "db_owner", "-d", "matchmaking_transfer", "-v", "ON_ERROR_STOP=1", "--single-transaction", "-f", "/migrations/001_matching.sql"]
    volumes:
      - ../matchmaking-external/infra/migrations:/migrations:ro
    networks: [transfer-db-net]
    depends_on:
      transfer-db:
        condition: service_healthy
    restart: "no"
volumes:
  external-session-data:
secrets:
  external_session_key:
    file: ../matchmaking-external/.local/secrets/session.key
