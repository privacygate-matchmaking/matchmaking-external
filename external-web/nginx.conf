server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # 접속 주소: 이 포트는 127.0.0.1 에만 열려 있어 로컬 브라우저나 Tailscale(Funnel·serve)만 들어온다.
    # Tailscale 이 X-Forwarded-For 끝에 붙인 실제 접속 주소를 쓴다 (가입 요청 횟수 제한용). 직접 접속이면 그대로.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    client_max_body_size 3m;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/ {
        proxy_pass http://external-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Cache-Control;
    }
    location /auth/ {
        proxy_pass http://external-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Cache-Control;
    }
    location / { try_files $uri $uri/ /index.html; }
}
